[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
description = "Bare-metal latency lab for the clusteralloc core"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = true   # symbols stay in the ELF for gdb; objcopy drops them from the image
